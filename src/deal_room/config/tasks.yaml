analyze_financials:
  description: >
    Review the following company description / pitch text and extract every
    financial signal it contains:

    {company_info}

    Assess burn rate, runway, and unit economics (CAC, LTV, margins, revenue
    growth) using only what is explicitly stated or can be directly derived
    from it. Do not invent numbers or assume industry-average figures to fill
    gaps. If a signal needed for a full assessment (e.g. burn rate, CAC, LTV,
    churn, funding raised) is missing or ambiguous, explicitly say so instead
    of guessing.

    You must score data_completeness and confidence independently — they
    answer different questions and must not influence each other:
    - data_completeness reflects ONLY what fraction of the required fields
      (burn rate, runway, CAC, LTV, gross margin, churn) were actually
      disclosed in the input. This is a measure of the INPUT, not the
      business. A pitch that discloses all six should score "high" even if
      those numbers reveal a struggling business. A pitch missing most of
      them should score "low" regardless of how good the disclosed numbers
      look.
    - confidence reflects ONLY your read on the company's financial health
      based on whatever data was actually available. This is a measure of
      the BUSINESS, not the input. A complete dataset that reveals a
      cash-negative business, thin margins, or high churn should score LOW
      confidence even though data_completeness is high. A sparse dataset
      gives you little to reason about, so confidence should also be low
      in that case — but for the different reason that there isn't enough
      information to judge health either way, not because the data itself
      is incomplete.
  expected_output: >
    A structured assessment with: a burn rate assessment (stated or inferred
    monthly burn, or a note that it can't be determined); a runway estimate
    (in months, or a note that it can't be determined given available data);
    notes on unit economics (CAC, LTV, margins, growth trends, and how they
    relate); a list of specific red flags found in the pitch (or an empty
    list if none); a data_completeness level of "high", "medium", or "low"
    reflecting ONLY what fraction of burn/runway/CAC/LTV/margin/churn data
    was present in the input; and a confidence level of "high", "medium", or
    "low" reflecting ONLY the analyst's judgment of financial health based on
    the available data, independent of data_completeness.
  agent: financial_analyst
  output_pydantic: FinancialAssessment

analyze_market:
  description: >
    Review the following company description / pitch text and assess its
    market and competitive position:

    {company_info}

    Assess market size (TAM/SAM/SOM if derivable, or note that it isn't),
    the competitive landscape (named or implied competitors, substitutes,
    or reasons the space is uncontested), and timing (why now, or why the
    timing is questionable). Do not accept "blue ocean" or "no competition"
    claims at face value — if the pitch doesn't name real alternatives,
    say so as a gap rather than assuming the market truly has none. Do not
    invent a TAM figure that isn't stated or directly derivable.
  expected_output: >
    A structured assessment with: market_size_notes (stated or derivable
    market sizing, or a note that it can't be determined); competitive_landscape
    (named/implied competitors and substitutes, or a note that none were
    disclosed and that's itself a gap); timing_assessment (why now, or why
    timing is unclear/risky); and a list of specific red flags (or an empty
    list if none).
  agent: market_analyst
  output_pydantic: MarketAssessment

analyze_technical:
  description: >
    Review the following company description / pitch text and evaluate the
    credibility of its technical claims and moat:

    {company_info}

    Identify any technical claims made (proprietary technology, unique
    architecture, defensibility) and assess whether they're specific enough
    to be credible or are generic language that could apply to any
    competitor. If no technical claims are made at all, say so rather than
    inventing a moat assessment. Do not accept vague claims ("AI-powered,"
    "proprietary") as evidence of a real moat without specifics backing
    them up.
  expected_output: >
    A structured assessment with: moat_credibility rated "strong",
    "moderate", "weak", or "unclear" (use "unclear" when the pitch makes no
    verifiable technical claims one way or another); technical_claims_notes
    explaining what claims were made and why they were rated that way; and
    a list of specific red flags (or an empty list if none).
  agent: technical_diligence_agent
  output_pydantic: TechnicalAssessment

assess_risk:
  description: >
    Review the following company description / pitch text and identify
    downside risks:

    {company_info}

    Assess regulatory risk (exposure implied by the business model or
    industry), team risk (gaps in the founding team, missing key roles,
    single-person dependencies), and market-timing risk (too early, too
    late, or a closing window). Only list risks that are actually
    supported by something in the pitch or a well-known characteristic of
    the industry it operates in — do not fabricate risks with no basis.
  expected_output: >
    A structured assessment with: regulatory_risks (list, empty if none
    identified), team_risks (list, empty if none identified),
    market_timing_risks (list, empty if none identified), and an
    overall_risk_level of "low", "medium", or "high" reflecting the
    combined severity of the risks found.
  agent: risk_assessor
  output_pydantic: RiskAssessment

produce_investment_memo:
  description: >
    Produce a complete investment memo for the following company:

    {company_info}

    Cover financial health, market position, technical credibility, and
    risk profile. Delegate to your specialist analysts as needed, and if
    any specialist's initial answer is too thin or vague, re-query them
    for more detail before finalizing.

    The `recommendation` field must be exactly one of these three strings,
    with spaces (not underscores) and no other punctuation or casing
    changes: 'pursue', 'pass', 'needs more diligence'. For example, write
    "needs more diligence" — never "needs_more_diligence" or
    "Needs More Diligence".
  expected_output: >
    A structured investment memo with: company_summary (brief neutral
    description of what the company does); financial_summary (from the
    financial analyst's findings); market_summary (from the market
    analyst's findings); technical_summary (from the technical diligence
    findings); risk_summary (from the risk assessor's findings);
    key_red_flags (a consolidated list of the most material red flags
    across all specialist findings); a recommendation that must be exactly
    one of: 'pursue', 'pass', 'needs more diligence' (with spaces, not
    underscores); and a confidence level of "high", "medium", or "low" in
    that recommendation.
  output_pydantic: InvestmentMemo
